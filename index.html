<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chandigarh Police — AI Content Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-text">
        <span class="brand-title">Chandigarh Police</span>
        <span class="brand-subtitle">WE CARE FOR YOU</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#" class="nav-item active">
        <span class="nav-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </span>
        <span>AI Content Detection</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </span>
        <span>Previous Cases</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        </span>
        <span>Case Analysis</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <span>Media Source</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill">
        <span class="user-avatar"></span>
        <span>Chd Police</span>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <h1 class="page-title">AI Content Detection</h1>

    <!-- Stepper -->
    <div class="stepper">
      <div class="step active">
        <span class="step-dot"></span>
        <span class="step-label">Step 1</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <span class="step-dot"></span>
        <span class="step-label">Step 2</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <span class="step-dot"></span>
        <span class="step-label">Step 3</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <span class="step-dot"></span>
        <span class="step-label">Step 4</span>
      </div>
    </div>

    <h2 class="section-title">Upload Media</h2>

    <!-- Upload card -->
    <div class="upload-card">
      <div class="upload-glow"></div>

      <div class="upload-card-content">
        <h3 class="upload-heading">Upload Image, Video or URL link</h3>
        <p class="upload-subtext">Keep the file size less than 50MB</p>

        <div class="url-input-wrap">
          <svg class="url-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input type="text" placeholder="www.instagram.com/sample_account" />
        </div>

        <div class="action-buttons">
          <button class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Upload Image/Video
          </button>
          <button class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Drag &amp; Drop
          </button>
        </div>

        <input type="file" id="fileInput" accept="image/*,video/*" hidden />
      </div>
    </div>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
